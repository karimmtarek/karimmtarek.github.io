about:
  section_label: "About"
  section_title: "About Karim Tarek"
  paragraphs:
    - "I'm Karim Tarek, a senior Shopify developer based in Victoria, BC. I have worked in web development for more than 17 years. Since 2017, I've contributed to dozens of Shopify stores through direct client projects and agency work. That includes nearly three years at PIVOT, a Shopify Plus agency partner, contributing to more than 20 DTC storefronts."
    - "I also built and maintain [FieldsRaven](https://apps.shopify.com/fieldsraven), a published Shopify app, and [StoreAudit](https://ai.storeaudit.app/), an AI-readiness audit for Shopify stores."
    - "Before Shopify, I worked at the ALDO Group, worked on a contest web app for Keurig's Canadian Rivo launch at Le Site in Montreal, and managed the UAE web presence for Doctors Without Borders. I hold a Project Management certificate from McGill and a B.Sc. in Computer Engineering."
    - "I work remotely and have for years. Questions before recommendations. Clear tradeoffs: if an existing tool or a smaller change makes more sense, I'll say so. Early communication. Care with the handover."
  quote:
    body: Fast and flexible and dedicated to delivering work that fit our needs.
    name: Amy Boyle
    title: COO, June & January
    thumb: "amy.jpg"


projects:
  section_label: "Selected work"
  section_title: "Selected Shopify Plus work at PIVOT"
  section_description: "At PIVOT, a Shopify Plus agency partner, I contributed to more than 20 DTC storefronts over nearly three years, working within existing codebases and small development teams. Here are four of them, with my part in each."
  list:
    - name: "Timbuk2"
      category: "Bags and accessories"
      subtitle: "My contribution at PIVOT, a Shopify Plus agency partner"
      context: "Custom Shopify Plus storefront for a bag brand with a complex product catalog."
      contributions:
        - "Custom Liquid templates and responsive front-end work"
        - "Integration work with Klevu search and Elevar tracking"
        - "Structured data schemas"
        - "Help center, sustainability pages, store locator and corporate page system"
      stack: ["Liquid", "Klevu", "Elevar", "Structured data"]
      duration: "14 months"

    - name: "UrbanStems"
      category: "Gifting and subscriptions"
      subtitle: "My contribution at PIVOT, a Shopify Plus agency partner"
      context: "Custom Shopify Plus storefront for a flower and gifting brand with subscriptions and seasonal campaigns."
      contributions:
        - "Product tile system for collection pages"
        - "Yotpo review widget integration and styling on product pages"
        - "Structured data: Organization, Product and Article"
        - "Landing pages for the rewards, referral and corporate gifting programs"
        - "Subscription landing page templates and video in hero sections"
      stack: ["Yotpo", "Structured data", "Landing page templates"]

    - name: "X-Chair"
      category: "Furniture and ergonomics"
      subtitle: "My contribution at PIVOT, a Shopify Plus agency partner"
      context: "Custom Shopify Plus storefront for an ergonomic chair brand with a product configurator on the product page."
      contributions:
        - "Homepage styling to match the X-Chair design system"
        - "Affirm pay-over-time messaging on product, cart and collection pages"
        - "Klevu search and filtering on collections"
        - "Yotpo reviews and user-generated content"
        - "Elevar scripts for checkout tracking"
        - "Corporate pages, help center, store locator and warranty forms"
      stack: ["Affirm", "Klevu", "Yotpo", "Elevar"]
      duration: "18 months"

    - name: "Celluma"
      category: "Health and wellness"
      subtitle: "My contribution at PIVOT, a Shopify Plus agency partner"
      context: "Content-heavy Shopify Plus storefront for an LED light therapy brand with professional and consumer audiences."
      contributions:
        - "Content page templates and blog filtering with author views"
        - "Rebuy cart integration: free gift logic and backorder messaging"
        - "Klaviyo form and modal integrations with GA event tracking"
        - "Accessibility fixes: focus traps, alt attributes and translations"
        - "Theme settings scoped between the US and international stores"
      stack: ["Rebuy", "Klaviyo forms", "GA events", "Accessibility", "Multi-store settings"]

  other:
    - name: "Ecommerce operations backend"
      category: "Rails backend"
      subtitle: "An anonymized client project"
      body: "I built a Rails backend for an ecommerce business that turned incoming order data into internal orders, customer records and workflows for different staff roles. It connected those workflows with Shopify customer data, shipping, tax, notifications and order status."
      tags:
        - "Ruby on Rails"
        - "Shopify customer data"
        - "Shipping and tax"
        - "Notifications"

  earlier:
    - name: "Keurig Rivo Launch Campaign"
      category: "Campaign build"
      subtitle: "Contest web app at Le Site, an ecommerce agency in Montreal"
      body: "For the Canadian launch of the Keurig Rivo espresso machine, I worked on a contest web app at Le Site in Montreal, delivered in three to four weeks from brief to launch. I also automated the campaign's email build process, cutting production time from eight hours to two using Middleman and the Google Docs API. This predates my Shopify focus, but it shows I can work on time-sensitive projects with tight deadlines."
      tags:
        - "Web Application"
        - "Process Automation"
        - "Middleman"
        - "Google Docs API"

beyond_client_work:
  section_label: "My own products"
  section_title: "Built and maintained by me"
  section_description: "Building my own products has meant working through the whole process: defining the idea, writing the application, releasing it and maintaining it afterward."
  projects:
    - name: "FieldsRaven"
      subtitle: "A published Shopify app"
      category: "Own product"
      body: "FieldsRaven extends Shopify's Metafields API to the storefront through an app proxy, enabling merchants to collect data on the fly and personalize their theme. Shopify doesn't expose that natively. Built with Ruby on Rails, I handle the full lifecycle: ideation, architecture, development, deployment, App Store review, and merchant support. Having a live app gives me platform depth that's hard to get from client work alone. I understand the API constraints, the review process, and how merchants actually use extended functionality in the real world."
      url: "https://apps.shopify.com/fieldsraven"
      link_label: "Explore FieldsRaven"
      tags:
        - "Ruby on Rails"
        - "Shopify App Store"
        - "Metafields API"
        - "App Proxy"
        - "Full Product Lifecycle"

    - name: "StoreAudit"
      subtitle: "A Rails application for storefront audits and reports"
      category: "Own product"
      body: "StoreAudit is a Shopify AI-readiness audit I built and maintain in Ruby on Rails. It reads public storefront and catalog data, checks product content and structured data, and asks Claude, ChatGPT, and Gemini what they know about a brand. Merchants get scored findings tied to affected products and specific fixes, with a prioritized action plan available in the full audit."
      url: "https://ai.storeaudit.app/"
      link_label: "Explore StoreAudit"
      tags:
        - "Ruby on Rails"
        - "Shopify"
        - "AI readiness"
        - "Product-level reports"
        - "Brand visibility"



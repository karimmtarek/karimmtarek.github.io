      role: "Monte Design · Review, March 4, 2026"
      quote: "Working with Karim has been a great experience. An exceptional Shopify developer who is dependable and highly professional. Always meets deadlines, communicates clearly, and writes efficient, well-structured code. What really stands out is his ability to think outside the box and offer creative solutions that elevate the project beyond expectations. A true asset to any team. Would absolutely work with Karim again."

    - name: "Matt Magi"
      role: "Co-Founder, Voltage New Media"

projects:
  section_label: "Selected work"
  section_title: "Selected Shopify Plus work at PIVOT"
  section_description: "At PIVOT, a Shopify Plus agency partner, I contributed to more than 20 DTC storefronts over nearly three years, working within existing codebases and small development teams. Here are four of them, with my part in each."
  list:
    - name: "Timbuk2"
      subtitle: "My contribution at PIVOT, a Shopify Plus agency partner"
      category: "Bags and accessories"
      body: "Timbuk2 is a bag brand with a loyal customer base and a complex product catalog. At PIVOT, I worked on their custom Shopify Plus storefront as part of a small dev team over 14 months. My contributions included custom Liquid templates, responsive front-end implementation, structured data schemas, and integration work across their marketing and analytics stack including Klevu search and Elevar tracking. I also worked on their help center, eco/sustainability pages, store locator, and corporate page system."
      tags:
        - "Liquid templates"
        - "Klevu search"
        - "Elevar scripts"
        - "Structured data"
        - "Help center"

    - name: "UrbanStems"
      subtitle: "My contribution at PIVOT, a Shopify Plus agency partner"
      category: "Gifting and subscriptions"
      body: "UrbanStems is a modern flower and gifting brand with subscription complexity and seasonal campaigns. At PIVOT, I worked on their custom Shopify Plus storefront, contributing product tile systems for the PLP, Yotpo review widget integration and styling on the PDP, structured data implementation (Organization, Product, Article schemas), and landing pages for their rewards, referral, and corporate gifting programs. I also worked on subscription landing page templates and video integration for hero sections."
      tags:
        - "Yotpo reviews"
        - "Structured data"
        - "Subscription landing pages"
        - "Rewards and referral pages"
        - "Corporate gifting template"

    - name: "X-Chair"
      subtitle: "My contribution at PIVOT, a Shopify Plus agency partner"
      category: "Furniture and ergonomics"
      body: "X-Chair sells ergonomic chairs with a product configurator that lets customers build custom combinations. At PIVOT, I was on this project for 18 months. My work included homepage styling to match the X-Chair design system, Affirm buy-now-pay-later messaging across PDP, cart, and PLP, Klevu integration for collection search and filtering, Yotpo for reviews and UGC, Elevar scripts for checkout tracking, and front-end builds for corporate pages, help centers, store locators, and warranty forms."
      tags:
        - "Affirm"
        - "Klevu search"
        - "Yotpo reviews"
        - "Elevar scripts"

    - name: "Celluma"
      subtitle: "My contribution at PIVOT, a Shopify Plus agency partner"
      category: "Health and wellness"
      body: "Celluma sells LED light therapy devices to professional and consumer audiences, which calls for a content-heavy storefront with educational pages. At PIVOT, I contributed to this project as part of a small dev team. My work covered content page templates, blog filtering with author views, Rebuy cart integration for free gift logic and variant backorder messaging, Klaviyo modal and form integrations with GA event tracking, and accessibility improvements including focus traps, alt attributes, and translations. I also worked on theme settings to scope changes between their US and international stores."
      tags:
        - "Rebuy cart"
        - "Klaviyo forms"
        - "GA events"
        - "Accessibility"
        - "Multi-store settings"

beyond_client_work:
  section_label: "Own products and earlier work"
  section_title: "A published Shopify app, and earlier campaign work"
  section_description: "FieldsRaven, a published Shopify app I built and maintain, and an earlier campaign project."
  projects:
    - name: "FieldsRaven"
      subtitle: "My Own Shopify App - Live on the Shopify App Store"
      category: "Own product"
      body: "FieldsRaven extends Shopify's Metafields API to the storefront through an app proxy, enabling merchants to collect data on the fly and personalize their theme - functionality Shopify doesn't expose natively. Built with Ruby on Rails, I handle the full lifecycle: ideation, architecture, development, deployment, App Store review, and merchant support. Having a live app gives me platform depth that's hard to get from client work alone - I understand the API constraints, the review process, and how merchants actually use extended functionality in the real world."
      tags:
        - "Ruby on Rails"
        - "Shopify App Store"
        - "Metafields API"
        - "App Proxy"
        - "Full Product Lifecycle"

    - name: "Keurig Rivo Launch Campaign"
      subtitle: "Contest Web App - Built at Le Site (E-commerce Agency, Montreal)"
      category: "Campaign build"
      body: "For the Canadian launch of the Keurig Rivo espresso machine, I worked on a contest web app at Le Site, an e-commerce agency in Montreal. The app was delivered in 3-4 weeks from brief to launch, attracted hundreds of thousands of visitors, and generated over 30,000 social shares. I also automated the campaign's email build process, cutting production time from 8 hours to 2 hours using Middleman and the Google Docs API. This predates my Shopify focus, but it shows I can work on high-traffic, time-sensitive projects with tight deadlines."
      tags:
        - "Web Application"
        - "High Traffic"
        - "30K+ Social Shares"
        - "3-4 Week Turnaround"
        - "Process Automation"

how_i_help:
  section_label: "Working with me"
  section_title: "Working with me"
  body: "I spent nearly 3 years working on custom Shopify Plus storefronts at PIVOT, a Shopify Plus Agency Partner. Now I work directly with brands and agencies. I'm available for ongoing retainers, project-based work, or a mix of both, and I usually work on retainer so I can learn your theme, your integrations, and the edge cases that tend to show up at the worst times."
  checklist:
    - "Ongoing backlog work, bug fixes, and theme cleanup"
    - "PDP and cart work: configurators, bundles, subscriptions, sticky ATCs, and size charts"
    - "Third-party integrations: Klaviyo, Yotpo, Rebuy, Klevu, Elevar, and Affirm"
    - "Landing pages, seasonal campaigns, and launch support"
    - "Structured data, SEO hygiene, and site speed improvements"



testimonials:
  section_label: "Recommendations"
  section_title: "Recommendations from clients and colleagues"
  quotes:
    - name: "Mary-Kevin Stuart"
      role: "Entrepreneur - Shopify Store Owner"
      quote: "I recently launched my Shopify store and I hired Karim to help with the development of the site. Karim did an amazing job with all of the projects I gave him and he exceeded all of my expectations. I was particularly impressed with Karim's communication, timeliness, receptivity to feedback, and attention to detail. He was very open to change and communicative about creative approaches we could take and the potential impact to the original estimate. I wholeheartedly recommend Karim."
      thumb: "mary-kevin.jpg"

    - name: "Jayme Thomson"
      role: "Shopify Store Owner"
      quote: "Twice I got told I would have to compromise on the changes I wanted for my website, until I contacted Karim. He implemented a challenging filter change to my delight. If there are more cost effective, efficient and better ways to do what you are trying to achieve he will tell you."
      thumb: "jayme.svg"

    - name: "Ericca Garrison"
      role: "Shopify Store Owner"
      quote: "Karim did an excellent job, he met and exceeded all expectations. He communicated clearly at each phase of the project."
      thumb: "ericca.jpg"

    - name: "James Corr"
      role: "Growth Consultant - Product & GTM Expert"
      quote: "Karim is a passionate developer that strives to better himself and improve his craft. He has helped OnlyGrowth with front-end development for Shopify sites. Karim is very responsive and communicates when he will be away or needs an extension. Unlike a lot of developers, Karim is also fairly good with estimating tasks and QA'ing his work prior to saying it is done."
      thumb: "james.jpg"

    - name: "Matt Magi"
      role: "Co-Founder, Voltage New Media"
      quote: "Karim worked with us as a contractor for ~2 years. I was always impressed with his punctuality, organization, problem solving and ability to think outside the box. He was never afraid to push back and make suggestions which would always benefit the projects we worked on together."
      thumb: "matt.jpg"

    - name: "Ysaël Pépin"
      role: "IT Development Manager, ALDO Group"
      quote: "Not only he would deliver quality work on time, but also made sure he was improving his source code while keeping it readable and maintainable. His eye for design and his constant curiosity was also very appreciated by our team."
      thumb: "ysael.jpg"


about:
  section_label: "About"
  section_title: "About Karim Tarek"
  paragraphs:
    - "I'm Karim Tarek, a senior Shopify developer based in Victoria, BC. I have worked in web development for more than 17 years. Since 2017, I've contributed to dozens of Shopify stores through direct client projects and agency work. That includes nearly three years at PIVOT, a Shopify Plus agency partner, contributing to more than 20 DTC storefronts."
    - "I also built and maintain [FieldsRaven](https://apps.shopify.com/fieldsraven), a published Shopify app."
    - "Before Shopify, I worked at the ALDO Group, worked on a contest web app for Keurig's Canadian Rivo launch at Le Site in Montreal, and managed the UAE web presence for Doctors Without Borders. I hold a Project Management certificate from McGill and a B.Sc. in Computer Engineering."
    - "I work remotely and have for years. Questions before recommendations. Clear tradeoffs: if an existing tool or a smaller change makes more sense, I'll say so. Early communication. Care with the handover."
  quote:
    body: Fast and flexible and dedicated to delivering work that fit our needs.
    name: Amy Boyle
    title: COO, June & January
    thumb: "amy.jpg"

